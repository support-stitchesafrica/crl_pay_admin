<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Stitches Africa - Fashion Store</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: #f8f9fa;
            color: #1a1a1a;
        }

        /* Header */
        .header {
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo h1 {
            font-size: 24px;
            color: #2563eb;
            font-weight: 700;
        }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .my-loans-button {
            background: #10b981;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .my-loans-button:hover {
            background: #059669;
        }

        .cart-button {
            position: relative;
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .cart-button:hover {
            background: #1d4ed8;
        }

        .cart-count {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #dc2626;
            color: white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }

        /* Hero Section */
        .hero {
            background: #2563eb;
            color: white;
            padding: 80px 20px;
            text-align: center;
        }

        .hero h2 {
            font-size: 48px;
            margin-bottom: 16px;
            font-weight: 700;
        }

        .hero p {
            font-size: 20px;
            opacity: 0.95;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Products Section */
        .products-section {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 32px;
            margin-bottom: 30px;
            color: #1a1a1a;
            font-weight: 700;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        .product-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #e5e7eb;
            transition: all 0.2s;
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.1);
            border-color: #2563eb;
        }

        .product-image {
            width: 100%;
            height: 300px;
            background: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            color: #9ca3af;
        }

        .product-info {
            padding: 20px;
        }

        .product-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #1a1a1a;
        }

        .product-description {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 16px;
            line-height: 1.6;
        }

        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .product-price {
            font-size: 24px;
            font-weight: 700;
            color: #2563eb;
        }

        .add-to-cart-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .add-to-cart-btn:hover {
            background: #1d4ed8;
        }

        /* Cart Sidebar */
        .cart-sidebar {
            position: fixed;
            right: -400px;
            top: 0;
            width: 400px;
            height: 100vh;
            background: white;
            box-shadow: -2px 0 16px rgba(0,0,0,0.1);
            transition: right 0.3s;
            z-index: 200;
            display: flex;
            flex-direction: column;
        }

        .cart-sidebar.open {
            right: 0;
        }

        .cart-header {
            padding: 20px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-header h3 {
            font-size: 24px;
            color: #1a1a1a;
            font-weight: 700;
        }

        .close-cart {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #6b7280;
            transition: color 0.2s;
        }

        .close-cart:hover {
            color: #1a1a1a;
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .cart-item {
            display: flex;
            gap: 15px;
            padding: 15px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            margin-bottom: 15px;
            background: #ffffff;
        }

        .cart-item-image {
            width: 80px;
            height: 80px;
            background: #f3f4f6;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: #9ca3af;
        }

        .cart-item-details {
            flex: 1;
        }

        .cart-item-name {
            font-weight: 600;
            margin-bottom: 5px;
            color: #1a1a1a;
        }

        .cart-item-price {
            color: #2563eb;
            font-weight: 600;
        }

        .cart-item-remove {
            background: #dc2626;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .cart-item-remove:hover {
            background: #b91c1c;
        }

        .cart-footer {
            padding: 20px;
            border-top: 1px solid #e5e7eb;
            background: #f9fafb;
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .checkout-btn {
            width: 100%;
            background: #2563eb;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .checkout-btn:hover {
            background: #1d4ed8;
        }

        .checkout-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .empty-cart {
            text-align: center;
            padding: 40px;
            color: #9ca3af;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            z-index: 150;
        }

        .overlay.show {
            display: block;
        }

        /* Success Modal */
        .success-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            z-index: 300;
            display: none;
            max-width: 500px;
            width: 90%;
        }

        .success-modal.show {
            display: block;
        }

        .success-icon {
            font-size: 64px;
            text-align: center;
            margin-bottom: 20px;
        }

        .success-title {
            font-size: 28px;
            text-align: center;
            margin-bottom: 10px;
            color: #1a1a1a;
            font-weight: 700;
        }

        .success-message {
            text-align: center;
            color: #6b7280;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .success-details {
            background: #f9fafb;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            border: 1px solid #e5e7eb;
        }

        .success-details p {
            margin-bottom: 12px;
            color: #374151;
        }

        .success-details p:last-child {
            margin-bottom: 0;
        }

        .success-details strong {
            color: #1a1a1a;
        }

        .close-modal-btn {
            width: 100%;
            background: #2563eb;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .close-modal-btn:hover {
            background: #1d4ed8;
        }

        /* Repayment Schedule Table */
        .schedule-section {
            margin-top: 24px;
        }

        .schedule-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .schedule-header h4 {
            font-size: 16px;
            font-weight: 600;
            color: #1a1a1a;
        }

        .download-buttons {
            display: flex;
            gap: 8px;
        }

        .download-btn {
            background: #f3f4f6;
            color: #374151;
            border: 1px solid #e5e7eb;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .download-btn:hover {
            background: #e5e7eb;
            border-color: #2563eb;
            color: #2563eb;
        }

        .schedule-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
            font-size: 13px;
        }

        .schedule-table th {
            background: #f9fafb;
            padding: 10px;
            text-align: left;
            font-weight: 600;
            color: #374151;
            border-bottom: 2px solid #e5e7eb;
        }

        .schedule-table td {
            padding: 10px;
            border-bottom: 1px solid #e5e7eb;
            color: #1a1a1a;
        }

        .schedule-table tr:last-child td {
            border-bottom: none;
        }

        .schedule-table tr:hover {
            background: #f9fafb;
        }

        /* Loans Modal */
        .loans-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 0;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            z-index: 300;
            display: none;
            max-width: 800px;
            width: 90%;
            max-height: 90vh;
            overflow: hidden;
        }

        .loans-modal.show {
            display: flex;
            flex-direction: column;
        }

        .loans-modal-header {
            padding: 24px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f9fafb;
        }

        .loans-modal-header h3 {
            font-size: 24px;
            color: #1a1a1a;
            font-weight: 700;
        }

        .loans-modal-body {
            padding: 24px;
            overflow-y: auto;
            flex: 1;
        }

        .loan-card {
            background: #f9fafb;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            transition: all 0.2s;
        }

        .loan-card:hover {
            border-color: #2563eb;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.1);
        }

        .loan-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .loan-account {
            font-size: 18px;
            font-weight: 700;
            color: #2563eb;
            font-family: monospace;
        }

        .loan-status {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .loan-status.active {
            background: #dbeafe;
            color: #1e40af;
        }

        .loan-status.completed {
            background: #d1fae5;
            color: #065f46;
        }

        .loan-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }

        .loan-detail-item {
            display: flex;
            flex-direction: column;
        }

        .loan-detail-label {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 4px;
        }

        .loan-detail-value {
            font-size: 16px;
            font-weight: 600;
            color: #1a1a1a;
        }

        .loan-actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #e5e7eb;
        }

        .liquidate-btn {
            flex: 1;
            background: #10b981;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .liquidate-btn:hover {
            background: #059669;
        }

        .liquidate-btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        /* Liquidation Modal */
        .liquidation-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 0;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            z-index: 400;
            display: none;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow: hidden;
        }

        .liquidation-modal.show {
            display: flex;
            flex-direction: column;
        }

        .liquidation-modal-header {
            padding: 24px;
            border-bottom: 1px solid #e5e7eb;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }

        .liquidation-modal-header h3 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .liquidation-modal-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .liquidation-modal-body {
            padding: 24px;
            overflow-y: auto;
            flex: 1;
        }

        .liquidation-type-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .liquidation-type-btn {
            padding: 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .liquidation-type-btn:hover {
            border-color: #10b981;
        }

        .liquidation-type-btn.active {
            border-color: #10b981;
            background: #d1fae5;
        }

        .liquidation-type-btn .icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .liquidation-type-btn .title {
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 4px;
        }

        .liquidation-type-btn .desc {
            font-size: 12px;
            color: #6b7280;
        }

        .amount-input-group {
            margin-bottom: 24px;
        }

        .amount-input-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #1a1a1a;
        }

        .amount-input-wrapper {
            display: flex;
            gap: 8px;
        }

        .amount-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .amount-input:focus {
            outline: none;
            border-color: #10b981;
        }

        .calculate-btn {
            padding: 12px 24px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .calculate-btn:hover {
            background: #1d4ed8;
        }

        .liquidation-summary {
            background: linear-gradient(135deg, #d1fae5 0%, #a7f3d0 100%);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 24px;
        }

        .liquidation-summary .total {
            text-align: center;
            margin-bottom: 16px;
        }

        .liquidation-summary .total-label {
            font-size: 14px;
            color: #065f46;
            margin-bottom: 4px;
        }

        .liquidation-summary .total-amount {
            font-size: 32px;
            font-weight: 700;
            color: #065f46;
        }

        .liquidation-breakdown {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .breakdown-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            background: white;
            border-radius: 8px;
        }

        .breakdown-item .label {
            color: #6b7280;
        }

        .breakdown-item .value {
            font-weight: 600;
            color: #1a1a1a;
        }

        .liquidation-actions {
            display: flex;
            gap: 12px;
        }

        .cancel-btn {
            flex: 1;
            padding: 14px;
            background: #f3f4f6;
            color: #374151;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .cancel-btn:hover {
            background: #e5e7eb;
        }

        .confirm-liquidation-btn {
            flex: 2;
            padding: 14px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .confirm-liquidation-btn:hover {
            background: #059669;
        }

        .confirm-liquidation-btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            background: #fee2e2;
            border: 1px solid #fecaca;
            color: #991b1b;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .cart-sidebar {
                width: 100%;
                right: -100%;
            }

            .hero h2 {
                font-size: 32px;
            }

            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-content">
            <div class="logo">
                <span>🏪</span>
                <h1>Stitches Africa</h1>
            </div>
            <div class="header-actions">
                <button class="my-loans-button" onclick="showMyLoans()">
                    💳 My Loans
                </button>
                <button class="cart-button" onclick="toggleCart()">
                    🛒 Cart
                    <span class="cart-count" id="cartCount">0</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Hero Section -->
    <div class="hero">
        <h2>Premium Fashion Collection</h2>
        <p>Buy now, pay later with flexible installments</p>
    </div>

    <!-- Products Section -->
    <div class="products-section">
        <h2 class="section-title">Featured Products</h2>
        <div class="products-grid" id="productsGrid"></div>
    </div>

    <!-- Cart Sidebar -->
    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h3>Shopping Cart</h3>
            <button class="close-cart" onclick="toggleCart()">✕</button>
        </div>
        <div class="cart-items" id="cartItems">
            <div class="empty-cart">
                <p>Your cart is empty</p>
            </div>
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total:</span>
                <span id="cartTotal">₦0</span>
            </div>
            <button class="checkout-btn" id="checkoutBtn" onclick="proceedToCheckout()" disabled>
                Proceed to Checkout
            </button>
        </div>
    </div>

    <!-- Overlay -->
    <div class="overlay" id="overlay" onclick="toggleCart()"></div>

    <!-- Loans Modal -->
    <div class="loans-modal" id="loansModal">
        <div class="loans-modal-header">
            <h3>My Loans</h3>
            <button class="close-cart" onclick="closeLoansModal()">✕</button>
        </div>
        <div class="loans-modal-body" id="loansModalBody">
            <p style="text-align: center; color: #6b7280;">Loading loans...</p>
        </div>
    </div>

    <!-- Liquidation Modal -->
    <div class="liquidation-modal" id="liquidationModal">
        <div class="liquidation-modal-header">
            <h3>Liquidate Loan</h3>
            <p id="liquidationLoanAccount"></p>
        </div>
        <div class="liquidation-modal-body" id="liquidationModalBody">
            <!-- Content will be dynamically populated -->
        </div>
    </div>

    <!-- Success Modal -->
    <div class="success-modal" id="successModal">
        <div class="success-icon">✅</div>
        <h3 class="success-title">Payment Successful!</h3>
        <p class="success-message">Your order has been confirmed and will be processed shortly.</p>
        <div class="success-details" id="successDetails"></div>
        <button class="close-modal-btn" onclick="closeSuccessModal()">Continue Shopping</button>
    </div>

    <!-- Load CRL Pay SDK -->
    <script src="./crlpay-sdk.js"></script>

    <script>
        // Products catalog
        const products = [
            {
                id: 1,
                name: 'Premium Designer Dress',
                price: 45000,

                id: 6,
                name: 'Sunglasses',
                price: 12000,
                description: 'Stylish UV protection sunglasses',
                emoji: '🕶️'
            }
        ];

        // Shopping cart
        let cart = [];

        // CRL Pay configuration
        const publicKey = 'pk_1b689d60c35a36c014b0809437bf55b8c063ca25d893a8c8';
        const secretKey = 'sk_9d2f90ddac6955021bc0f4f4305265ee6d5dc3f5d5e7f683fdd56212812084eb'; // Merchant secret key
        const apiBaseUrl = 'http://localhost:3006/api/v1';
        const customerEmail = 'customer@example.com'; // In production, get from logged-in user
        
        const crlpay = new CRLPay({
            publicKey: publicKey,
            mode: 'iframe'
        });

        // Initialize products
        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = products.map(product => `
                <div class="product-card">
                    <div class="product-image">${product.emoji}</div>
                    <div class="product-info">
                        <div class="product-name">${product.name}</div>
                        <div class="product-description">${product.description}</div>
                        <div class="product-footer">
                            <div class="product-price">₦${product.price.toLocaleString()}</div>
                            <button class="add-to-cart-btn" onclick="addToCart(${product.id})">
                                Add to Cart
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Add to cart
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existingItem = cart.find(item => item.id === productId);

            if (existingItem) {
                existingItem.quantity++;
            } else {
                cart.push({ ...product, quantity: 1 });
            }

            updateCart();
            showNotification('Added to cart!');
        }

        // Remove from cart
        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            updateCart();
        }

        // Update cart UI
        function updateCart() {
            const cartItems = document.getElementById('cartItems');
            const cartCount = document.getElementById('cartCount');
            const cartTotal = document.getElementById('cartTotal');
            const checkoutBtn = document.getElementById('checkoutBtn');

            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

            cartCount.textContent = totalItems;
            cartTotal.textContent = `₦${totalPrice.toLocaleString()}`;

            if (cart.length === 0) {
                cartItems.innerHTML = '<div class="empty-cart"><p>Your cart is empty</p></div>';
                checkoutBtn.disabled = true;
            } else {
                cartItems.innerHTML = cart.map(item => `
                    <div class="cart-item">
                        <div class="cart-item-image">${item.emoji}</div>
                        <div class="cart-item-details">
                            <div class="cart-item-name">${item.name}</div>
                            <div class="cart-item-price">₦${item.price.toLocaleString()} × ${item.quantity}</div>
                            <button class="cart-item-remove" onclick="removeFromCart(${item.id})">Remove</button>
                        </div>
                    </div>
                `).join('');
                checkoutBtn.disabled = false;
            }
        }

        // Toggle cart
        function toggleCart() {
            const sidebar = document.getElementById('cartSidebar');
            const overlay = document.getElementById('overlay');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('show');
        }

        // Proceed to checkout
        function proceedToCheckout() {
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const orderItems = cart.map(item => `${item.name} (×${item.quantity})`).join(', ');

            crlpay.checkout({
                amount: totalPrice,
                email: 'customer@example.com',
                reference: 'STI_' + Date.now(),
                metadata: {
                    items: cart,
                    itemCount: cart.reduce((sum, item) => sum + item.quantity, 0),
                    orderSummary: orderItems
                },
                onSuccess: function(response) {
                    showSuccessModal(response);
                    cart = [];
                    updateCart();
                    toggleCart();
                },
                onError: function(error) {
                    alert('Payment failed: ' + (error.message || 'Unknown error'));
                },
                onClose: function() {
                    console.log('Checkout closed');
                }
            });
        }

        // Show success modal
        function showSuccessModal(response) {
            const modal = document.getElementById('successModal');
            const overlay = document.getElementById('overlay');
            const details = document.getElementById('successDetails');

            // Store response globally for download functions
            window.loanResponse = response;

            const schedule = response.repaymentSchedule || [];
            const scheduleRows = schedule.map((item, index) => `
                <tr>
                    <td>${index + 1}</td>
                    <td>${new Date(item.dueDate).toLocaleDateString()}</td>
                    <td>₦${(item.amount || 0).toLocaleString()}</td>
                    <td><span style="color: #f59e0b; font-weight: 600;">${item.status || 'Pending'}</span></td>
                </tr>
            `).join('');

            details.innerHTML = `
                <p><strong>Loan Account Number:</strong> <span style="font-size: 18px; color: #2563eb; font-family: monospace;">${response.loan?.loanAccountNumber || 'N/A'}</span></p>
                <p><strong>Loan ID:</strong> ${response.loanId || 'N/A'}</p>
                <p><strong>Amount:</strong> ₦${(response.amount || 0).toLocaleString()}</p>
                <p><strong>Plan:</strong> ${response.plan?.plan?.name || 'N/A'}</p>
                <p><strong>Installments:</strong> ${response.plan?.numberOfInstallments || 0} payments</p>
                
                <div class="schedule-section">
                    <div class="schedule-header">
                        <h4>Repayment Schedule</h4>
                        <div class="download-buttons">
                            <button class="download-btn" onclick="downloadSchedule('excel')">📊 Excel</button>
                            <button class="download-btn" onclick="downloadSchedule('csv')">📄 CSV</button>
                            <button class="download-btn" onclick="downloadSchedule('txt')">📝 Text</button>
                        </div>
                    </div>
                    <table class="schedule-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Due Date</th>
                                <th>Amount</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${scheduleRows}
                        </tbody>
                    </table>
                </div>
            `;

            modal.classList.add('show');
            overlay.classList.add('show');
        }

        // Close success modal
        function closeSuccessModal() {
            const modal = document.getElementById('successModal');
            const overlay = document.getElementById('overlay');
            modal.classList.remove('show');
            overlay.classList.remove('show');
        }

        // Download repayment schedule
        function downloadSchedule(format) {
            const response = window.loanResponse;
            if (!response || !response.repaymentSchedule) {
                alert('No schedule data available');
                return;
            }

            const schedule = response.repaymentSchedule;
            const accountNumber = response.loan?.loanAccountNumber || 'N/A';
            const loanId = response.loanId || 'N/A';
            const amount = response.amount || 0;
            const planName = response.plan?.plan?.name || 'N/A';

            if (format === 'excel' || format === 'csv') {
                // CSV format (can be opened in Excel)
                let csv = 'Loan Account Number,' + accountNumber + '\n';
                csv += 'Loan ID,' + loanId + '\n';
                csv += 'Principal Amount,₦' + amount.toLocaleString() + '\n';
                csv += 'Plan,' + planName + '\n\n';
                csv += 'Installment #,Due Date,Amount,Status\n';
                
                schedule.forEach((item, index) => {
                    csv += `${index + 1},${new Date(item.dueDate).toLocaleDateString()},₦${(item.amount || 0).toLocaleString()},${item.status || 'Pending'}\n`;
                });

                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `repayment-schedule-${accountNumber}.csv`;
                link.click();
            } else if (format === 'txt') {
                // Plain text format
                let txt = '='.repeat(60) + '\n';
                txt += 'REPAYMENT SCHEDULE\n';
                txt += '='.repeat(60) + '\n\n';
                txt += 'Loan Account Number: ' + accountNumber + '\n';
                txt += 'Loan ID: ' + loanId + '\n';
                txt += 'Principal Amount: ₦' + amount.toLocaleString() + '\n';
                txt += 'Plan: ' + planName + '\n';
                txt += '\n' + '-'.repeat(60) + '\n\n';
                
                schedule.forEach((item, index) => {
                    txt += `Installment #${index + 1}\n`;
                    txt += `  Due Date: ${new Date(item.dueDate).toLocaleDateString()}\n`;
                    txt += `  Amount: ₦${(item.amount || 0).toLocaleString()}\n`;
                    txt += `  Status: ${item.status || 'Pending'}\n`;
                    txt += '\n';
                });

                txt += '-'.repeat(60) + '\n';

                const blob = new Blob([txt], { type: 'text/plain;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `repayment-schedule-${accountNumber}.txt`;
                link.click();
            }
        }

        // Show notification
        function showNotification(message) {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: #4caf50;
                color: white;
                padding: 15px 25px;
                border-radius: 8px;
                box-shadow: 0 4px 15px rgba(0,0,0,0.2);
                z-index: 1000;
                animation: slideIn 0.3s ease;
            `;
            notification.textContent = message;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.remove();
            }, 2000);
        }

        // ========== LIQUIDATION FUNCTIONS ==========

        let currentLiquidationLoan = null;
        let liquidationCalculation = null;

        // Show My Loans modal
        async function showMyLoans() {
            const modal = document.getElementById('loansModal');
            const overlay = document.getElementById('overlay');
            const body = document.getElementById('loansModalBody');

            modal.classList.add('show');
            overlay.classList.add('show');
            body.innerHTML = '<p style="text-align: center; color: #6b7280;">Loading loans...</p>';

            try {
                // Fetch customer loans using secret key
                const response = await fetch(`${apiBaseUrl}/loans/customer/${customerEmail}`, {
                    headers: {
                        'x-api-key': secretKey
                    }
                });

                if (!response.ok) {
                    throw new Error('Failed to fetch loans');
                }

                const result = await response.json();
                const loans = result.data || [];

                if (loans.length === 0) {
                    body.innerHTML = '<p style="text-align: center; color: #6b7280;">No active loans found</p>';
                    return;
                }

                // Render loans
                body.innerHTML = loans.map(loan => `
                    <div class="loan-card">
                        <div class="loan-card-header">
                            <div class="loan-account">${loan.loanAccountNumber || loan.loanId}</div>
                            <div class="loan-status ${loan.status}">${loan.status}</div>
                        </div>
                        <div class="loan-details">
                            <div class="loan-detail-item">
                                <div class="loan-detail-label">Principal Amount</div>
                                <div class="loan-detail-value">₦${loan.principalAmount.toLocaleString()}</div>
                            </div>
                            <div class="loan-detail-item">
                                <div class="loan-detail-label">Amount Paid</div>
                                <div class="loan-detail-value">₦${loan.amountPaid.toLocaleString()}</div>
                            </div>
                            <div class="loan-detail-item">
                                <div class="loan-detail-label">Amount Remaining</div>
                                <div class="loan-detail-value">₦${loan.amountRemaining.toLocaleString()}</div>
                            </div>
                            <div class="loan-detail-item">
                                <div class="loan-detail-label">Installments</div>
                                <div class="loan-detail-value">${loan.configuration.numberOfInstallments} payments</div>
                            </div>
                        </div>
                        ${loan.status === 'active' ? `
                            <div class="loan-actions">
                                <button class="liquidate-btn" onclick='openLiquidationModal(${JSON.stringify(loan)})'>
                                    💰 Liquidate Loan
                                </button>
                            </div>
                        ` : ''}
                    </div>
                `).join('');

            } catch (error) {
                console.error('Error fetching loans:', error);
                body.innerHTML = '<p style="text-align: center; color: #dc2626;">Failed to load loans. Please try again.</p>';
            }
        }

        // Close loans modal
        function closeLoansModal() {
            const modal = document.getElementById('loansModal');
            const overlay = document.getElementById('overlay');
            modal.classList.remove('show');
            overlay.classList.remove('show');
        }

        // Open liquidation modal
        async function openLiquidationModal(loan) {
            currentLiquidationLoan = loan;
            liquidationCalculation = null;

            const modal = document.getElementById('liquidationModal');
            const overlay = document.getElementById('overlay');
            const accountElement = document.getElementById('liquidationLoanAccount');
            const body = document.getElementById('liquidationModalBody');

            accountElement.textContent = `Account: ${loan.loanAccountNumber}`;
            
            modal.classList.add('show');
            overlay.classList.add('show');

            // Fetch max liquidation amount
            body.innerHTML = '<p style="text-align: center; color: #6b7280;">Loading liquidation details...</p>';

            try {
                const response = await fetch(`${apiBaseUrl}/loans/liquidation/max-amount/${loan.loanId}`, {
                    headers: {
                        'x-api-key': secretKey
                    }
                });

                console.log('Liquidation response status:', response.status);

                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('API error response:', errorText);
                    throw new Error(`Failed to fetch liquidation amount: ${response.status}`);
                }

                const result = await response.json();
                console.log('Liquidation API result:', result);
                
                if (!result.success || !result.data) {
                    throw new Error(result.message || 'Invalid API response');
                }
                
                const maxData = result.data;
                console.log('Max liquidation data:', maxData);

                // Render liquidation UI
                renderLiquidationUI(maxData);

            } catch (error) {
                console.error('Error fetching liquidation amount:', error);
                body.innerHTML = `<div class="error-message">Failed to load liquidation details. ${error.message}</div>`;
            }
        }

        // Render liquidation UI
        function renderLiquidationUI(maxData) {
            const body = document.getElementById('liquidationModalBody');
            
            body.innerHTML = `
                <div class="liquidation-type-selector">
                    <div class="liquidation-type-btn active" id="fullLiquidationBtn" onclick="selectLiquidationType('full', ${maxData.maxAmount})">
                        <div class="icon">💯</div>
                        <div class="title">Full Liquidation</div>
                        <div class="desc">Pay off entire loan</div>
                    </div>
                    <div class="liquidation-type-btn" id="partialLiquidationBtn" onclick="selectLiquidationType('partial', ${maxData.maxAmount})">
                        <div class="icon">📊</div>
                        <div class="title">Partial Liquidation</div>
                        <div class="desc">Pay custom amount</div>
                    </div>
                </div>

                <div class="amount-input-group" id="partialAmountGroup" style="display: none;">
                    <label>Amount to Pay (Max: ₦${maxData.maxAmount.toLocaleString()})</label>
                    <div class="amount-input-wrapper">
                        <input type="number" class="amount-input" id="partialAmountInput" placeholder="Enter amount" max="${maxData.maxAmount}">
                        <button class="calculate-btn" onclick="calculatePartialLiquidation(${maxData.maxAmount})">Calculate</button>
                    </div>
                </div>

                <div id="liquidationSummaryContainer"></div>

                <div class="liquidation-actions">
                    <button class="cancel-btn" onclick="closeLiquidationModal()">Cancel</button>
                    <button class="confirm-liquidation-btn" id="confirmLiquidationBtn" onclick="confirmLiquidation()" disabled>
                        Confirm Payment
                    </button>
                </div>
            `;

            // Auto-show full liquidation summary
            liquidationCalculation = maxData;
            console.log('✅ Initial liquidation data set from max-amount:', liquidationCalculation);
            showLiquidationSummary(maxData);
        }

        // Select liquidation type
        function selectLiquidationType(type, maxAmount) {
            const fullBtn = document.getElementById('fullLiquidationBtn');
            const partialBtn = document.getElementById('partialLiquidationBtn');
            const partialGroup = document.getElementById('partialAmountGroup');

            if (type === 'full') {
                fullBtn.classList.add('active');
                partialBtn.classList.remove('active');
                partialGroup.style.display = 'none';
                
                // Fetch full liquidation calculation
                calculateFullLiquidation();
            } else {
                fullBtn.classList.remove('active');
                partialBtn.classList.add('active');
                partialGroup.style.display = 'block';
                document.getElementById('liquidationSummaryContainer').innerHTML = '';
                document.getElementById('confirmLiquidationBtn').disabled = true;
            }
        }

        // Calculate full liquidation
        async function calculateFullLiquidation() {
            const summaryContainer = document.getElementById('liquidationSummaryContainer');
            summaryContainer.innerHTML = '<p style="text-align: center; color: #6b7280;">Calculating...</p>';

            try {
                const response = await fetch(`${apiBaseUrl}/loans/liquidation/calculate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': secretKey
                    },
                    body: JSON.stringify({
                        loanId: currentLiquidationLoan.loanId
                    })
                });

                if (!response.ok) {
                    throw new Error('Failed to calculate liquidation');
                }

                const result = await response.json();
                liquidationCalculation = result.data;
                console.log('✅ Full liquidation calculated:', liquidationCalculation);
                showLiquidationSummary(liquidationCalculation);

            } catch (error) {
                console.error('Error calculating liquidation:', error);
                summaryContainer.innerHTML = '<div class="error-message">Failed to calculate. Please try again.</div>';
            }
        }

        // Calculate partial liquidation
        async function calculatePartialLiquidation(maxAmount) {
            const input = document.getElementById('partialAmountInput');
            const amount = parseFloat(input.value);

            if (isNaN(amount) || amount <= 0) {
                alert('Please enter a valid amount');
                return;
            }

            if (amount > maxAmount) {
                alert(`Amount cannot exceed ₦${maxAmount.toLocaleString()}`);
                return;
            }

            const summaryContainer = document.getElementById('liquidationSummaryContainer');
            summaryContainer.innerHTML = '<p style="text-align: center; color: #6b7280;">Calculating...</p>';

            try {
                const response = await fetch(`${apiBaseUrl}/loans/liquidation/calculate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': secretKey
                    },
                    body: JSON.stringify({
                        loanId: currentLiquidationLoan.loanId,
                        amount: amount
                    })
                });

                if (!response.ok) {
                    throw new Error('Failed to calculate liquidation');
                }

                const result = await response.json();
                liquidationCalculation = result.data;
                showLiquidationSummary(liquidationCalculation);

            } catch (error) {
                console.error('Error calculating liquidation:', error);
                summaryContainer.innerHTML = '<div class="error-message">Failed to calculate. Please try again.</div>';
            }
        }

        // Show liquidation summary
        function showLiquidationSummary(calculation) {
            console.log('showLiquidationSummary called with:', calculation);
            
            const summaryContainer = document.getElementById('liquidationSummaryContainer');
            const confirmBtn = document.getElementById('confirmLiquidationBtn');
            
            // Validate calculation object
            if (!calculation || !calculation.breakdown) {
                console.error('Invalid calculation object:', calculation);
                summaryContainer.innerHTML = '<div class="error-message">Invalid liquidation data</div>';
                return;
            }
            
            // Handle both maxAmount (from max-amount endpoint) and totalDue (from calculate endpoint)
            const totalAmount = calculation.totalDue || calculation.maxAmount;
            
            if (!totalAmount) {
                console.error('No totalDue or maxAmount in calculation:', calculation);
                summaryContainer.innerHTML = '<div class="error-message">Missing amount data</div>';
                return;
            }

            summaryContainer.innerHTML = `
                <div class="liquidation-summary">
                    <div class="total">
                        <div class="total-label">Total Amount Due</div>
                        <div class="total-amount">₦${totalAmount.toLocaleString()}</div>
                    </div>
                    <div class="liquidation-breakdown">
                        <div class="breakdown-item">
                            <span class="label">Principal</span>
                            <span class="value">₦${(calculation.breakdown.unpaidPrincipal || 0).toLocaleString()}</span>
                        </div>
                        <div class="breakdown-item">
                            <span class="label">Accrued Interest</span>
                            <span class="value">₦${(calculation.breakdown.accruedInterest || 0).toLocaleString()}</span>
                        </div>
                        ${(calculation.breakdown.lateFees || 0) > 0 ? `
                            <div class="breakdown-item">
                                <span class="label">Late Fees</span>
                                <span class="value">₦${calculation.breakdown.lateFees.toLocaleString()}</span>
                            </div>
                        ` : ''}
                    </div>
                    ${!calculation.isFullLiquidation && calculation.remainingBalance ? `
                        <div style="margin-top: 12px; padding: 12px; background: white; border-radius: 8px; text-align: center;">
                            <div style="font-size: 12px; color: #6b7280; margin-bottom: 4px;">Remaining Balance</div>
                            <div style="font-size: 18px; font-weight: 700; color: #2563eb;">₦${calculation.remainingBalance.toLocaleString()}</div>
                        </div>
                    ` : ''}
                </div>
            `;

            confirmBtn.disabled = false;
        }

        // Confirm liquidation
        async function confirmLiquidation() {
            console.log('🔍 confirmLiquidation called, liquidationCalculation:', liquidationCalculation);
            
            if (!liquidationCalculation) {
                console.error('❌ liquidationCalculation is null/undefined');
                alert('Please calculate liquidation first');
                return;
            }

            const confirmBtn = document.getElementById('confirmLiquidationBtn');
            confirmBtn.disabled = true;
            confirmBtn.innerHTML = '<span class="loading-spinner"></span> Processing...';

            try {
                const reference = `LIQ_${Date.now()}`;
                const payload = {
                    loanId: currentLiquidationLoan.loanId,
                    reference: reference,
                    method: 'auto_debit'
                };
                
                // Only include amount for partial liquidation
                if (!liquidationCalculation.isFullLiquidation) {
                    payload.amount = liquidationCalculation.totalDue;
                }
                
                console.log('📤 Sending liquidation payload:', payload);
                console.log('📊 isFullLiquidation:', liquidationCalculation.isFullLiquidation);
                
                const response = await fetch(`${apiBaseUrl}/loans/liquidation/process`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': secretKey
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.message || 'Liquidation failed');
                }

                const result = await response.json();
                console.log('Liquidation result:', result);
                
                // Get the calculation from the response
                const processedCalculation = result.data?.calculation || liquidationCalculation;

                // Close liquidation modal
                closeLiquidationModal();
                closeLoansModal();

                // Show success message
                const amount = processedCalculation?.totalDue || 0;
                const isFullLiquidation = processedCalculation?.isFullLiquidation || false;
                
                alert(`✅ Liquidation Successful!\n\nAmount: ₦${amount.toLocaleString()}\nReference: ${reference}\n\n${isFullLiquidation ? 'Your loan has been fully paid off!' : 'Partial payment processed successfully!'}`);

            } catch (error) {
                console.error('Error processing liquidation:', error);
                alert('❌ Liquidation Failed: ' + error.message);
                confirmBtn.disabled = false;
                confirmBtn.innerHTML = 'Confirm Payment';
            }
        }

        // Close liquidation modal
        function closeLiquidationModal() {
            const modal = document.getElementById('liquidationModal');
            const overlay = document.getElementById('overlay');
            modal.classList.remove('show');
            if (!document.getElementById('loansModal').classList.contains('show')) {
                overlay.classList.remove('show');
            }
            currentLiquidationLoan = null;
            liquidationCalculation = null;
        }

        // Initialize
        renderProducts();
    </script>
</body>
</html>
